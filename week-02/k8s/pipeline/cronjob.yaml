apiVersion: batch/v1
kind: CronJob
metadata:
  name: gdelt-pipeline
  namespace: gdelt
spec:
  schedule: "*/20 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: gdelt-pipeline
              image: ghcr.io/ivan-artemev-dev/parse_gdelt:latest
              env:
                - name: ES_HOST
                  value: http://elasticsearch:9200
          restartPolicy: OnFailure
