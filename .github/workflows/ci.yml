name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push parse_gdelt
        uses: docker/build-push-action@v5
        with:
          context: ./week-02/parse_gdelt
          push: true
          tags: ghcr.io/${{ github.actor }}/parse_gdelt:latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./week-02/gdelt_dashboard/backend
          push: true
          tags: ghcr.io/${{ github.actor }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./week-02/gdelt_dashboard/frontend
          push: true
          tags: ghcr.io/${{ github.actor }}/frontend:latest